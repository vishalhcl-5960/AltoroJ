name: "HCL AppScan DAST - noLogin"
on:
  workflow_dispatch
jobs:
  scan:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run ASoC DAST Scan
        uses: HCL-TECH-SOFTWARE/appscan-dast-action@v1.0.9
        with:
          scan_name: no_login_self_hosted_with_fail_non_Compliance
          baseurl:  https://blmycldtl446131.appscan-test.local
          acceptssl: true
          asoc_key: ${{secrets.AS360_KEY}}
          asoc_secret: ${{secrets.AS360_SECRET}}
          application_id: 98d32960-53ec-4885-8232-8ad61a067815
          dynamic_scan_type: dast
          starting_URL: 'https://demo.testfire.net'
          login_method: none
          network: public
          fail_for_noncompliance: true
          wait_for_analysis: true
      - uses: actions/upload-artifact@v6
        name: Upload HCL AppScan HTML Report to Github Artifacts
        with:
          name: AppScan Security Scan HTML Report 
          path: '**/AppScan*.html'
        if: success() || failure()
