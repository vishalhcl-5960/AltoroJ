name: "HCL AppScan DAST - noLogin"
on:
  workflow_dispatch
jobs:
  scan:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Run ASoC DAST Scan
        uses: HCL-TECH-SOFTWARE/appscan-dast-action@main
        with:
          baseurl:  https://cloud.appscan.com
          asoc_key: ${{secrets.ASOC_KEY}}
          asoc_secret: ${{secrets.ASOC_SECRET}}
          application_id: 7b3f217f-988c-41d5-9e91-877353174267
          scan_name: No_login_DAST_Customer-Script
          dynamic_scan_type: dast
          starting_URL: https://demo.testfire.net
          login_method: none
          network: public
          optimization: Fastest
          ephemeral_presence: false
          email_notification: true
          personal_scan: false
          wait_for_analysis: true
          wait_for_analysis_timeout_minutes: 360
          fail_for_noncompliance: false
          fail_by_severity: false
          failure_threshold: High
      - uses: actions/upload-artifact@v4.6.1
        name: Upload HCL AppScan HTML Report to Github Artifacts
        with:
          name: AppScan Security Scan HTML Report 
          path: '**/AppScan*.html'
        if: success() || failure()
